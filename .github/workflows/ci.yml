name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format, vet, and race tests
        run: make check
      - name: Build and exercise real CLI processes
        run: make demo
      - name: Fuzz packet parser
        if: runner.os == 'Linux'
        run: make fuzz
      - name: Preserve demo diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ runner.os }}
          path: demo-output/
          if-no-files-found: ignore
          retention-days: 7
